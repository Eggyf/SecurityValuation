[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcf-app"
version = "0.1.0"
description = "Valoración por Flujos de Caja Descontados (FCFF) a partir del Form 10-K de una empresa."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "streamlit>=1.37",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "scipy>=1.14",
    "plotly>=5.23",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    # Solo para `mypy --strict`, no son dependencias de ejecución.
    "pandas-stubs>=2.2",
    "types-beautifulsoup4>=4.12",
]

[tool.uv]
python-preference = "managed"

[tool.hatch.build.targets.wheel]
packages = ["src/dcf_app"]

# --- Calidad ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # shadowing de builtins
    "C4",  # comprehensions
    "DTZ", # datetime sin tz
    "T20", # print
    "SIM", # simplify
    "PTH", # pathlib
    "RUF",
    "ANN", # anotaciones de tipo
    "D",   # docstrings (AGENTS.md §8)
]
ignore = [
    "D203", # incompatible con D211
    "D213", # incompatible con D212
]

[tool.ruff.lint.per-file-ignores]
"src/dcf_app/ui/**" = ["ANN", "T20"]
"tests/**" = ["ANN", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# `Field(...)` como default es el patrón idiomático de pydantic, no un bug.
extend-immutable-calls = ["pydantic.Field"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: prueba de integración que requiere red; excluida por defecto (AGENTS.md §9)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/dcf_app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
